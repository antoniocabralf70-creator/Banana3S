name: Build banana3S
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Baixar o nucleo (Azahar, fork ativo do Citra)
        run: git clone --recursive https://github.com/azahar-emu/azahar.git
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas do Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0"
      - name: Trocar nome e icone para banana3S
        working-directory: azahar/src/android
        run: |
          find . -name strings.xml -path "*values*" -not -path "*/build/*" -exec sed -i -E 's|(<string name="app_name"[^>]*>)[^<]*(</string>)|\1banana3S\2|' {} +
          sed -i -E 's/applicationId = "[^"]*"/applicationId = "com.banana3s.app"/' app/build.gradle.kts
          FILES=$(find . -path "*mipmap-anydpi*" -name "ic_launcher*.xml" -not -path "*/build/*" || true)
          echo "Icones encontrados: $FILES"
          for f in $FILES; do
            RES=$(dirname "$(dirname "$f")")
            mkdir -p "$RES/drawable"
            cat > "$RES/drawable/ic_banana_b3s.xml" <<'EOF_I'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFD21F" android:strokeColor="#8A5A00" android:strokeWidth="2.5"
                  android:pathData="M28,68 Q44,92 78,62 Q92,46 84,26 L72,28 Q76,44 64,56 Q48,70 32,58 Z"/>
              <path android:fillColor="#5B3A00" android:pathData="M84,26 L72,28 L74,22 L82,20 Z"/>
          </vector>
          EOF_I
            cat > "$f" <<'EOF_I'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="#FFF3B0"/>
              <foreground android:drawable="@drawable/ic_banana_b3s"/>
          </adaptive-icon>
          EOF_I
          done
          git diff --stat | tail -20
      - name: Instalar interface banana3S
        working-directory: azahar/src/android
        run: |
          mkdir -p app/src/main/java/com/banana3s/app
          cat > app/src/main/java/com/banana3s/app/Game.kt <<'EOF_K'
          package com.banana3s.app
          import android.net.Uri
          data class Game(val name: String, val uri: Uri, val ext: String)
          EOF_K
          cat > app/src/main/java/com/banana3s/app/GameScanner.kt <<'EOF_K'
          package com.banana3s.app
          import android.content.Context
          import android.net.Uri
          import android.provider.DocumentsContract
          import android.provider.DocumentsContract.Document

          object GameScanner {
              // ROMs e homebrews aceitos
              val EXTS = setOf("3ds", "cci", "cia", "cxi", "3dsx", "app")

              fun scan(ctx: Context, tree: Uri): List<Game> {
                  val out = ArrayList<Game>()
                  fun walk(docId: String) {
                      val kids = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                      val cols = arrayOf(Document.COLUMN_DOCUMENT_ID, Document.COLUMN_DISPLAY_NAME, Document.COLUMN_MIME_TYPE)
                      ctx.contentResolver.query(kids, cols, null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val id = c.getString(0) ?: continue
                              val name = c.getString(1) ?: continue
                              if (c.getString(2) == Document.MIME_TYPE_DIR) { walk(id); continue }
                              val ext = name.substringAfterLast('.', "").lowercase()
                              if (ext in EXTS)
                                  out.add(Game(name.substringBeforeLast('.'), DocumentsContract.buildDocumentUriUsingTree(tree, id), ext))
                          }
                      }
                  }
                  walk(DocumentsContract.getTreeDocumentId(tree))
                  return out.sortedBy { it.name.lowercase() }
              }
          }
          EOF_K
          cat > app/src/main/java/com/banana3s/app/SmdhReader.kt <<'EOF_K'
          package com.banana3s.app
          import android.content.Context
          import android.graphics.Bitmap
          import android.net.Uri
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.channels.FileChannel

          /** Lê título, desenvolvedora e ícone (SMDH) direto do arquivo do jogo. */
          object SmdhReader {
              data class Info(val title: String, val publisher: String, val icon: Bitmap, val color: Int)
              private val cache = HashMap<Uri, Info?>()

              fun read(ctx: Context, uri: Uri, ext: String): Info? {
                  synchronized(cache) { if (cache.containsKey(uri)) return cache[uri] }
                  val info = try {
                      ctx.contentResolver.openFileDescriptor(uri, "r")?.use { pfd ->
                          FileInputStream(pfd.fileDescriptor).use { fis ->
                              val ch = fis.channel
                              val smdh = when (ext) { "3dsx" -> fromDsx(ch); "cia" -> fromCia(ch); else -> fromNcch(ch) }
                              smdh?.let { parse(it) }
                          }
                      }
                  } catch (e: Exception) { null }
                  synchronized(cache) { cache[uri] = info }
                  return info
              }

              private fun readAt(ch: FileChannel, off: Long, len: Int): ByteArray? {
                  val buf = ByteBuffer.allocate(len); var pos = off
                  while (buf.hasRemaining()) { val n = ch.read(buf, pos); if (n <= 0) return null; pos += n }
                  return buf.array()
              }
              private fun u32(b: ByteArray, o: Int) = ByteBuffer.wrap(b, o, 4).order(ByteOrder.LITTLE_ENDIAN).int.toLong() and 0xFFFFFFFFL
              private fun u16(b: ByteArray, o: Int) = ByteBuffer.wrap(b, o, 2).order(ByteOrder.LITTLE_ENDIAN).short.toInt() and 0xFFFF
              private fun magic(b: ByteArray, o: Int, s: String) = String(b, o, 4, Charsets.US_ASCII) == s

              private fun fromDsx(ch: FileChannel): ByteArray? {
                  val h = readAt(ch, 0, 0x2C) ?: return null
                  if (!magic(h, 0, "3DSX") || u16(h, 4) < 0x2C) return null
                  val size = u32(h, 0x24).toInt()
                  return if (size < 0x36C0) null else readAt(ch, u32(h, 0x20), size)
              }

              private fun fromCia(ch: FileChannel): ByteArray? {
                  val h = readAt(ch, 0, 0x18) ?: return null
                  fun a(x: Long) = (x + 63) and 63L.inv()
                  if (u32(h, 0x14) == 0L) return null
                  val meta = a(u32(h, 0)) + a(u32(h, 8)) + a(u32(h, 0xC)) + a(u32(h, 0x10))
                  return readAt(ch, meta + 0x400, 0x36C0)
              }

              // .3ds/.cci/.cxi (só funciona se o jogo estiver descriptografado)
              private fun fromNcch(ch: FileChannel): ByteArray? {
                  val h0 = readAt(ch, 0, 0x200) ?: return null
                  val base = if (magic(h0, 0x100, "NCSD")) u32(h0, 0x120) * 0x200 else 0L
                  val h = if (base == 0L) h0 else readAt(ch, base, 0x200) ?: return null
                  if (!magic(h, 0x100, "NCCH")) return null
                  if ((h[0x18F].toInt() and 4) == 0) return null // criptografado
                  val exefs = base + u32(h, 0x1A0) * 0x200
                  val eh = readAt(ch, exefs, 0x200) ?: return null
                  for (i in 0 until 10) {
                      val name = String(eh, i * 16, 8, Charsets.US_ASCII).trimEnd('\u0000')
                      if (name == "icon") {
                          val off = u32(eh, i * 16 + 8); val size = u32(eh, i * 16 + 12).toInt()
                          return if (size < 0x36C0) null else readAt(ch, exefs + 0x200 + off, size)
                      }
                  }
                  return null
              }

              private fun parse(b: ByteArray): Info? {
                  if (!magic(b, 0, "SMDH")) return null
                  val t = 0x8 + 0x200 // inglês
                  val title = String(b, t, 0x80, Charsets.UTF_16LE).trimEnd('\u0000')
                  val pub = String(b, t + 0x180, 0x80, Charsets.UTF_16LE).trimEnd('\u0000')
                  val px = IntArray(48 * 48); var r = 0L; var g = 0L; var bl = 0L
                  for (tile in 0 until 36) for (i in 0 until 64) {
                      val x = (i and 1) or (((i shr 2) and 1) shl 1) or (((i shr 4) and 1) shl 2)
                      val y = ((i shr 1) and 1) or (((i shr 3) and 1) shl 1) or (((i shr 5) and 1) shl 2)
                      val o = 0x24C0 + (tile * 64 + i) * 2
                      val v = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8)
                      val rr = (v shr 11 and 31) * 255 / 31; val gg = (v shr 5 and 63) * 255 / 63; val bb = (v and 31) * 255 / 31
                      px[((tile / 6) * 8 + y) * 48 + (tile % 6) * 8 + x] = (0xFF shl 24) or (rr shl 16) or (gg shl 8) or bb
                      r += rr; g += gg; bl += bb
                  }
                  val n = 48 * 48
                  val color = (0xFF shl 24) or ((r / n).toInt() shl 16) or ((g / n).toInt() shl 8) or (bl / n).toInt()
                  return Info(title, pub, Bitmap.createBitmap(px, 48, 48, Bitmap.Config.ARGB_8888), color)
              }
          }
          EOF_K
          cat > app/src/main/java/com/banana3s/app/B3sActivity.kt <<'EOF_K'
          package com.banana3s.app
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import java.util.concurrent.Executors

          private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
          private const val EMU = "org.citra.citra_emu.activities.EmulationActivity"
          private const val CORE_MAIN = "org.citra.citra_emu.ui.main.MainActivity"
          private val BANANA = Color.parseColor("#FFC800")

          /** Interface própria do banana3S. O núcleo (Azahar/Citra) roda o jogo. */
          class B3sActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private val pool = Executors.newFixedThreadPool(3)
              private val games = ArrayList<Game>()
              private lateinit var adapter: GameAdapter
              private lateinit var header: LinearLayout
              private lateinit var titleView: TextView
              private lateinit var hint: TextView
              private lateinit var prefs: SharedPreferences

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun onColor(c: Int) =
                  if (Color.red(c) * 0.299 + Color.green(c) * 0.587 + Color.blue(c) * 0.114 > 150) Color.BLACK else Color.WHITE
              private fun soft(c: Int) = Color.rgb(
                  (Color.red(c) * 0.25 + 255 * 0.75).toInt(),
                  (Color.green(c) * 0.25 + 255 * 0.75).toInt(),
                  (Color.blue(c) * 0.25 + 255 * 0.75).toInt())
              private fun pix(b: Bitmap) = BitmapDrawable(resources, b).apply { isFilterBitmap = false }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("b3s", MODE_PRIVATE)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#FFFBEA"))

                  header = LinearLayout(this)
                  header.setBackgroundColor(BANANA)
                  header.setPadding(dp(16), dp(40), dp(16), dp(14))
                  titleView = TextView(this)
                  titleView.text = "\uD83C\uDF4C banana3S"
                  titleView.textSize = 24f
                  titleView.typeface = Typeface.DEFAULT_BOLD
                  titleView.setTextColor(Color.BLACK)
                  header.addView(titleView)
                  root.addView(header, LinearLayout.LayoutParams(MATCH, WRAP))

                  val row = LinearLayout(this)
                  row.setPadding(dp(8), dp(8), dp(8), 0)
                  fun btn(t: String, f: () -> Unit): Button {
                      val b = Button(this)
                      b.text = t
                      b.isAllCaps = false
                      b.setOnClickListener { f() }
                      return b
                  }
                  row.addView(btn("Pasta de jogos") { pickFolder() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(btn("Abrir arquivo") { pickFile() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(btn("Núcleo") { openCore() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  root.addView(row, LinearLayout.LayoutParams(MATCH, WRAP))

                  hint = TextView(this)
                  hint.setPadding(dp(16), dp(8), dp(16), dp(8))
                  hint.text = "Escolha a pasta com seus .3ds, .cia, .cci, .cxi ou .3dsx."
                  root.addView(hint, LinearLayout.LayoutParams(MATCH, WRAP))

                  adapter = GameAdapter()
                  val list = ListView(this)
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ -> select(games[pos]) }
                  root.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  setContentView(root)

                  rescan()
                  if (!prefs.getBoolean("setup", false)) {
                      AlertDialog.Builder(this)
                          .setTitle("Primeira vez?")
                          .setMessage("Configure o núcleo uma vez (pasta de dados e drivers). Depois é só escolher o jogo.")
                          .setPositiveButton("Configurar") { _, _ ->
                              prefs.edit().putBoolean("setup", true).apply(); openCore() }
                          .setNegativeButton("Depois") { _, _ -> prefs.edit().putBoolean("setup", true).apply() }
                          .show()
                  }
              }

              private fun applyAccent(c: Int) {
                  header.setBackgroundColor(c)
                  titleView.setTextColor(onColor(c))
                  try { window.statusBarColor = c } catch (_: Exception) {}
              }

              @Suppress("DEPRECATION")
              private fun pickFolder() = startActivityForResult(
                  Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION), 1)

              @Suppress("DEPRECATION")
              private fun pickFile() = startActivityForResult(
                  Intent(Intent.ACTION_OPEN_DOCUMENT).setType("*/*").addCategory(Intent.CATEGORY_OPENABLE).addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION), 2)

              @Suppress("DEPRECATION")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  val uri = data?.data ?: return
                  if (res != RESULT_OK) return
                  try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                  if (req == 1) {
                      prefs.edit().putString("folder", uri.toString()).apply()
                      rescan()
                  } else if (req == 2) {
                      var n = "jogo"
                      try {
                          contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use {
                              if (it.moveToFirst()) n = it.getString(0) ?: n
                          }
                      } catch (_: Exception) {}
                      select(Game(n.substringBeforeLast('.'), uri, n.substringAfterLast('.', "").lowercase()))
                  }
              }

              private fun rescan() {
                  val s = prefs.getString("folder", null) ?: return
                  hint.text = "Procurando jogos..."
                  pool.execute {
                      val found: List<Game> = try { GameScanner.scan(this, Uri.parse(s)) } catch (e: Exception) { emptyList() }
                      ui.post {
                          games.clear(); games.addAll(found); adapter.notifyDataSetChanged()
                          hint.text = if (found.isEmpty()) "Nenhum jogo encontrado nessa pasta." else "${found.size} jogo(s)"
                      }
                  }
              }

              private fun select(g: Game) {
                  pool.execute {
                      val info = SmdhReader.read(this, g.uri, g.ext)
                      ui.post { showCard(g, info) }
                  }
              }

              // Cartão do jogo: ícone grande, título e o tema muda para a cor do ícone
              private fun showCard(g: Game, info: SmdhReader.Info?) {
                  val accent = info?.color ?: BANANA
                  applyAccent(accent)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  box.setPadding(dp(24), dp(24), dp(24), dp(8))
                  box.setBackgroundColor(soft(accent))
                  val img = ImageView(this)
                  if (info != null) img.setImageDrawable(pix(info.icon)) else img.setImageResource(android.R.drawable.ic_menu_gallery)
                  box.addView(img, LinearLayout.LayoutParams(dp(144), dp(144)))
                  val t = TextView(this)
                  t.text = info?.title?.ifBlank { null } ?: g.name
                  t.textSize = 20f
                  t.typeface = Typeface.DEFAULT_BOLD
                  t.gravity = Gravity.CENTER
                  t.setTextColor(Color.BLACK)
                  t.setPadding(0, dp(12), 0, 0)
                  box.addView(t, LinearLayout.LayoutParams(MATCH, WRAP))
                  val p = info?.publisher
                  if (!p.isNullOrBlank()) {
                      val pv = TextView(this)
                      pv.text = p
                      pv.gravity = Gravity.CENTER
                      pv.setTextColor(Color.DKGRAY)
                      box.addView(pv, LinearLayout.LayoutParams(MATCH, WRAP))
                  }
                  AlertDialog.Builder(this)
                      .setView(box)
                      .setPositiveButton("Jogar") { _, _ -> play(g.uri) }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun play(uri: Uri) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW)
                          .setClassName(this, EMU)
                          .setData(uri)
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                  } catch (e: Exception) {
                      Toast.makeText(this, "Não consegui abrir o núcleo: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun openCore() {
                  try { startActivity(Intent().setClassName(this, CORE_MAIN)) }
                  catch (e: Exception) { Toast.makeText(this, "Núcleo não encontrado", Toast.LENGTH_LONG).show() }
              }

              inner class GameAdapter : BaseAdapter() {
                  override fun getCount() = games.size
                  override fun getItem(position: Int): Any = games[position]
                  override fun getItemId(position: Int) = position.toLong()

                  private fun makeRow(): LinearLayout {
                      val r = LinearLayout(this@B3sActivity)
                      r.gravity = Gravity.CENTER_VERTICAL
                      r.setPadding(dp(12), dp(8), dp(12), dp(8))
                      r.addView(ImageView(this@B3sActivity), LinearLayout.LayoutParams(dp(56), dp(56)))
                      val col = LinearLayout(this@B3sActivity)
                      col.orientation = LinearLayout.VERTICAL
                      col.setPadding(dp(12), 0, 0, 0)
                      val t = TextView(this@B3sActivity)
                      t.textSize = 16f
                      t.setTextColor(Color.BLACK)
                      val s = TextView(this@B3sActivity)
                      s.setTextColor(Color.DKGRAY)
                      col.addView(t); col.addView(s)
                      r.addView(col)
                      return r
                  }

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val g = games[position]
                      val row = (convertView as? LinearLayout) ?: makeRow()
                      val icon = row.getChildAt(0) as ImageView
                      val col = row.getChildAt(1) as LinearLayout
                      val t = col.getChildAt(0) as TextView
                      val s = col.getChildAt(1) as TextView
                      t.text = g.name
                      s.text = g.ext.uppercase()
                      icon.tag = g.uri
                      icon.setImageDrawable(null)
                      pool.execute {
                          val info = SmdhReader.read(this@B3sActivity, g.uri, g.ext)
                          if (info != null) ui.post {
                              if (icon.tag == g.uri) {
                                  icon.setImageDrawable(pix(info.icon))
                                  t.text = info.title.ifBlank { g.name }
                                  s.text = info.publisher.ifBlank { g.ext.uppercase() }
                              }
                          }
                      }
                      return row
                  }
              }
          }
          EOF_K
          cat > patch_manifest.py <<'EOF_P'
          import re, glob
          act = """
              <activity android:name="com.banana3s.app.B3sActivity" android:exported="true"
                  android:label="banana3S" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
          """
          ok = False
          for f in glob.glob("app/src/**/AndroidManifest.xml", recursive=True):
              t = open(f, encoding="utf-8").read()
              t = re.sub(r'<category\s+android:name="android.intent.category.LAUNCHER"\s*/>', "", t)
              if f.replace("\\", "/").endswith("src/main/AndroidManifest.xml"):
                  assert "</application>" in t, "manifest sem </application>"
                  t = t.replace("</application>", act + "</application>", 1)
                  ok = True
              open(f, "w", encoding="utf-8").write(t)
          assert ok, "manifest principal nao encontrado"
          EOF_P
          python3 patch_manifest.py
          rm patch_manifest.py
          grep -n "B3sActivity" app/src/main/AndroidManifest.xml
      - name: Compilar APK
        working-directory: azahar/src/android
        run: |
          set -o pipefail
          chmod +x gradlew
          TASKS=$(./gradlew tasks --all --console=plain 2>/dev/null || true)
          TASK=assembleRelease
          if grep -q "^assembleVanillaRelease" <<< "$TASKS"; then TASK=assembleVanillaRelease; fi
          echo "Tarefa: $TASK"
          ./gradlew $TASK -Pandroid.injected.build.abi=arm64-v8a --no-daemon --console=plain 2>&1 | tee ../../build.log
      - name: Assinar APK
        working-directory: azahar
        run: |
          echo "== APK/AAB gerados =="
          find . \( -name "*.apk" -o -name "*.aab" \) -not -path "*/intermediates/*" || true
          APKS=$(find . -name "*.apk" -not -path "*/intermediates/*" -not -path "*/tmp/*" || true)
          APK=$(grep -i arm64 <<< "$APKS" | head -1 || true)
          if [ -z "$APK" ]; then APK=$(head -1 <<< "$APKS"); fi
          if [ -z "$APK" ]; then echo "Nenhum APK encontrado"; exit 1; fi
          echo "Usando: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore b3s.jks -alias b3s -keyalg RSA -keysize 2048 -validity 10000 -storepass banana3s -keypass banana3s -dname "CN=banana3S"
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$BT/apksigner" sign --ks b3s.jks --ks-pass pass:banana3s --key-pass pass:banana3s --out "$GITHUB_WORKSPACE/out/banana3S.apk" "$APK"
      - name: Mostrar erro
        if: failure()
        working-directory: azahar
        run: |
          grep -n -E "^e: |error:|What went wrong|Execution failed" -A6 build.log | head -80 || true
          echo "== final do log =="
          tail -40 build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: banana3S-apk
          path: out/banana3S.apk
